<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mochi's Nap Room</title>
<style>
  :root {
    --ink: #5a3d36;
    --card: rgba(255, 250, 244, 0.92);
    --accent: #ff8fab;
    --accent-soft: #ffe3ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #f6dcc8;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }
  .hud {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  .pill {
    background: var(--card); border-radius: 999px; padding: 8px 14px;
    box-shadow: 0 3px 0 rgba(90, 61, 54, 0.12);
    font-weight: bold; pointer-events: auto;
  }
  .hearts { font-size: 18px; }
  .hearts small { display: block; font-weight: normal; font-size: 12px; opacity: 0.75; }
  .status { font-size: 14px; text-align: center; margin-top: 4px; }
  .side { display: flex; gap: 6px; pointer-events: auto; }
  .toolbar {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px;
    background: var(--card); border-radius: 22px;
    box-shadow: 0 4px 0 rgba(90, 61, 54, 0.14);
  }
  button {
    font: inherit; color: var(--ink); cursor: pointer;
    border: 0; border-radius: 16px; background: transparent;
    padding: 8px 12px; min-width: 64px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 12px; font-weight: bold;
    transition: background 0.15s, transform 0.1s;
  }
  button .ico { font-size: 24px; line-height: 1; }
  button:hover { background: var(--accent-soft); }
  button:active { transform: scale(0.94); }
  button.on { background: var(--accent); color: #fff; }
  .side button { min-width: 0; padding: 8px 10px; background: var(--card); box-shadow: 0 3px 0 rgba(90, 61, 54, 0.12); }
  .side button .ico { font-size: 20px; }
  .toast {
    position: fixed; top: 76px; left: 50%; transform: translate(-50%, -10px);
    background: var(--card); padding: 10px 18px; border-radius: 16px;
    font-weight: bold; opacity: 0; transition: opacity 0.4s, transform 0.4s;
    pointer-events: none; text-align: center; max-width: calc(100% - 32px);
    box-shadow: 0 4px 0 rgba(90, 61, 54, 0.14);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 480px) {
    button { min-width: 52px; padding: 6px 8px; font-size: 11px; }
    .status { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="pill hearts" id="hearts">💗 0<small>next: 🎀 at 10</small></div>
  <div class="pill status" id="status">Mochi is looking around</div>
  <div class="side">
    <button id="coatBtn" title="Change fur"><span class="ico">🎨</span></button>
    <button id="accBtn" title="Change accessory"><span class="ico">🎀</span></button>
    <button id="soundBtn" title="Sound on/off"><span class="ico">🔊</span></button>
  </div>
</div>

<div class="toolbar">
  <button data-mode="pet" class="on"><span class="ico">✋</span>Pet</button>
  <button data-mode="play"><span class="ico">🪶</span>Play</button>
  <button data-mode="treat"><span class="ico">🐟</span>Treat</button>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = (id) => document.getElementById(id);

  // ---------- data ----------
  const COATS = [
    { name: 'Orange tabby', fur: '#f5a35c', line: '#9a5a2e', belly: '#fff1e2', stripe: '#d9803a' },
    { name: 'Gray fluff', fur: '#a9afbd', line: '#5d6272', belly: '#eef0f5', stripe: '#8b91a1' },
    { name: 'Midnight', fur: '#3c3644', line: '#1d1922', belly: '#5a5263', eye: '#f4d35e' },
    { name: 'Calico', fur: '#fff7ee', line: '#8a6a58', belly: '#ffffff', patches: ['#f0a35e', '#4a3c38'] },
    { name: 'Cream puff', fur: '#f7e3c4', line: '#a88a63', belly: '#fffaf1', stripe: '#e8c99c' },
  ];
  const ACCESSORIES = [
    { id: 'none', name: 'nothing', icon: '✨', at: 0 },
    { id: 'bow', name: 'ribbon bow', icon: '🎀', at: 10 },
    { id: 'bell', name: 'bell collar', icon: '🔔', at: 25 },
    { id: 'flowers', name: 'flower crown', icon: '🌼', at: 50 },
    { id: 'party', name: 'party hat', icon: '🥳', at: 90 },
    { id: 'crown', name: 'tiny crown', icon: '👑', at: 150 },
  ];

  // ---------- save ----------
  const save = { hearts: 0, coat: 0, acc: 0, sound: true };
  try {
    const s = JSON.parse(localStorage.getItem('mochi-save') || '{}');
    Object.assign(save, s);
  } catch (e) {}
  function persist() {
    try { localStorage.setItem('mochi-save', JSON.stringify(save)); } catch (e) {}
  }

  // ---------- layout ----------
  let W = 0, H = 0, U = 1, floorTop = 0, dpr = 1;
  const bed = { x: 0, y: 0 };
  const rug = { x: 0, y: 0 };
  const sun = { x: 0, y: 0 };
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    U = Math.max(0.7, Math.min(W / 900, H / 650, 1.4));
    floorTop = H * 0.48;
    bed.x = W * 0.8; bed.y = floorTop + (H - floorTop) * 0.38;
    rug.x = W * 0.46; rug.y = floorTop + (H - floorTop) * 0.5;
    sun.x = W * 0.3; sun.y = floorTop + (H - floorTop) * 0.3;
    if (cat.x === 0) { cat.x = W * 0.45; cat.y = rug.y; }
    cat.x = clamp(cat.x, minX(), maxX());
    cat.y = clamp(cat.y, minY(), maxY());
  }
  const minX = () => 60 * U, maxX = () => W - 60 * U;
  const minY = () => floorTop + 50 * U, maxY = () => H - 100 * U;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- state ----------
  let mode = 'pet';
  let time = 0;
  const cat = {
    x: 0, y: 0, tx: 0, ty: 0, dir: 1, scale: 1,
    state: 'wander', moving: false, walkPhase: 0, sitT: 2,
    idle: 0, petHold: 0, happyT: 0, blinkT: 3, blink: 0,
    hop: 0, pounceT: 0, pounceCd: 0, eatT: 0, zT: 0, petAcc: 0,
  };
  const toy = { x: 0, y: 0, vx: 0, lastMove: -99, inside: false };
  const treats = [];
  const parts = [];
  const clouds = Array.from({ length: 4 }, (_, i) => ({ x: i * 0.3 + Math.random() * 0.2, y: 0.25 + Math.random() * 0.5, s: 0.7 + Math.random() * 0.5 }));

  // ---------- sound ----------
  let actx = null, purrGain = null;
  function audio() {
    if (!save.sound) return null;
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        // purr: looped low noise, wobbled ~24 times a second
        const len = actx.sampleRate * 2;
        const buf = actx.createBuffer(1, len, actx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
        const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
        const wob = actx.createGain(); wob.gain.value = 0.5;
        const lfo = actx.createOscillator(); lfo.frequency.value = 24;
        const lfoAmt = actx.createGain(); lfoAmt.gain.value = 0.5;
        lfo.connect(lfoAmt).connect(wob.gain);
        purrGain = actx.createGain(); purrGain.gain.value = 0;
        src.connect(lp).connect(wob).connect(purrGain).connect(actx.destination);
        src.start(); lfo.start();
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function meow() {
    const a = audio(); if (!a) return;
    const t = a.currentTime, p = rand(0.9, 1.15);
    const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(480 * p, t);
    o.frequency.linearRampToValueAtTime(760 * p, t + 0.15);
    o.frequency.linearRampToValueAtTime(430 * p, t + 0.5);
    f.type = 'bandpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(900, t);
    f.frequency.linearRampToValueAtTime(1700, t + 0.15);
    f.frequency.linearRampToValueAtTime(800, t + 0.5);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.05);
    g.gain.linearRampToValueAtTime(0, t + 0.55);
    o.connect(f).connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.6);
  }
  function blip(freq = 880) {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.08);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.16);
  }
  function setPurr(on) {
    if (!actx || !purrGain) return;
    purrGain.gain.setTargetAtTime(on && save.sound ? 0.22 : 0, actx.currentTime, 0.25);
  }

  // ---------- ui ----------
  let toastTimer = 0;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function unlockedCount() { return ACCESSORIES.filter(a => save.hearts >= a.at).length; }
  function renderHearts() {
    const next = ACCESSORIES.find(a => save.hearts < a.at);
    $('hearts').innerHTML = `💗 ${save.hearts}<small>${next ? `next: ${next.icon} at ${next.at}` : 'everything unlocked!'}</small>`;
    $('accBtn').querySelector('.ico').textContent = ACCESSORIES[save.acc].icon;
  }
  function addHearts(n) {
    const before = unlockedCount();
    save.hearts += n;
    const after = unlockedCount();
    if (after > before) {
      const a = ACCESSORIES[after - 1];
      toast(`New for Mochi: ${a.name} ${a.icon}  (tap ${a.icon} up top)`);
      save.acc = after - 1;
      blip(660); setTimeout(() => blip(990), 120);
    }
    renderHearts(); persist();
  }

  document.querySelectorAll('.toolbar button').forEach(b => {
    b.addEventListener('click', () => {
      mode = b.dataset.mode;
      document.querySelectorAll('.toolbar button').forEach(x => x.classList.toggle('on', x === b));
      canvas.style.cursor = mode === 'play' ? 'none' : 'pointer';
      toast({ pet: 'Stroke Mochi, or tap the floor to call them over', play: 'Wiggle the feather around!', treat: 'Tap the floor to drop a fishy snack' }[mode]);
      audio();
    });
  });
  $('coatBtn').addEventListener('click', () => {
    save.coat = (save.coat + 1) % COATS.length;
    toast(COATS[save.coat].name); persist(); audio(); blip(700);
  });
  $('accBtn').addEventListener('click', () => {
    const n = unlockedCount();
    save.acc = (save.acc + 1) % n;
    const a = ACCESSORIES[save.acc];
    toast(n === 1 ? 'Collect 💗 to unlock cute accessories' : (a.id === 'none' ? 'Au naturel' : a.name + ' ' + a.icon));
    renderHearts(); persist(); audio(); blip(800);
  });
  function renderSound() { $('soundBtn').querySelector('.ico').textContent = save.sound ? '🔊' : '🔈'; }
  $('soundBtn').addEventListener('click', () => {
    save.sound = !save.sound; persist(); renderSound();
    if (save.sound) { audio(); blip(); } else setPurr(false);
  });

  // ---------- input ----------
  function catHit(x, y) {
    const s = cat.scale * U;
    const cy = cat.y - (cat.state === 'sleep' ? 22 : 38) * s - cat.hop * s;
    return Math.hypot((x - cat.x) / 1.3, y - cy) < 52 * s;
  }
  let pointerDown = false;
  function pos(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

  canvas.addEventListener('pointerdown', e => {
    pointerDown = true;
    const [x, y] = pos(e);
    audio();
    if (mode === 'pet') {
      if (catHit(x, y)) { pet(true); }
      else {
        wake();
        cat.state = 'wander'; cat.moving = true; cat.sitT = 0;
        cat.tx = clamp(x, minX(), maxX()); cat.ty = clamp(y, minY(), maxY());
        cat.idle = 0;
        if (Math.random() < 0.5) meow();
        spawn('text', x, y - 10, { text: 'here kitty~' });
      }
    } else if (mode === 'treat') {
      if (treats.length >= 3) { toast('Mochi has plenty of snacks for now 🐟'); return; }
      const fx = clamp(x, minX(), maxX()), fy = clamp(y, minY(), maxY());
      treats.push({ x: fx, y: fy, drop: 1, bite: 0 });
      blip(520);
    } else {
      moveToy(x, y);
    }
  });
  canvas.addEventListener('pointermove', e => {
    const [x, y] = pos(e);
    if (mode === 'play') moveToy(x, y);
    else if (mode === 'pet' && catHit(x, y) && (pointerDown || e.pointerType === 'mouse')) {
      if (pointerDown) pet(false);
      canvas.style.cursor = 'grab';
    } else if (mode === 'pet') canvas.style.cursor = 'pointer';
  });
  window.addEventListener('pointerup', () => { pointerDown = false; });
  canvas.addEventListener('pointerleave', () => { toy.inside = false; });

  function moveToy(x, y) {
    toy.vx = x - toy.x;
    if (Math.abs(x - toy.x) + Math.abs(y - toy.y) > 1) toy.lastMove = time;
    toy.x = x; toy.y = y; toy.inside = true;
  }
  function pet(first) {
    cat.idle = 0;
    cat.happyT = 1.2;
    if (cat.state !== 'sleep') { cat.petHold = 1.4; cat.moving = false; }
    if (first) cat.petAcc = 0.4; // instant heart on the first touch
    // hearts are earned per stroke time, see update()
    cat.petting = 0.25;
  }
  function wake() {
    if (cat.state === 'sleep' || cat.state === 'toBed') {
      cat.state = 'wander'; cat.moving = false; cat.sitT = 1;
      spawn('text', cat.x, cat.y - 90 * cat.scale * U, { text: '*stretch*' });
    }
  }

  // ---------- particles ----------
  function spawn(kind, x, y, o = {}) {
    parts.push(Object.assign({ kind, x, y, vx: rand(-15, 15), vy: rand(-55, -35), life: 0, max: 1.6, size: rand(8, 13) }, o));
  }

  // ---------- update ----------
  function moveToward(tx, ty, sp, dt) {
    const dx = tx - cat.x, dy = ty - cat.y, d = Math.hypot(dx, dy);
    if (d < 4) { cat.moving = false; return true; }
    const step = Math.min(d, sp * U * dt);
    cat.x += dx / d * step; cat.y += dy / d * step;
    if (Math.abs(dx) > 2) cat.dir = Math.sign(dx);
    cat.walkPhase += dt * 9 * (sp / 80);
    cat.moving = true;
    return false;
  }

  function update(dt) {
    time += dt;
    cat.idle += dt;
    cat.happyT -= dt; cat.petHold -= dt; cat.pounceCd -= dt;
    cat.petting = (cat.petting || 0) - dt;

    // blink now and then
    cat.blinkT -= dt;
    if (cat.blinkT < 0) { cat.blink = 0.15; cat.blinkT = rand(2, 5); }
    cat.blink -= dt;

    // petting rewards
    const beingPet = cat.petting > 0;
    if (beingPet) {
      cat.petAcc += dt;
      if (cat.petAcc > 0.4) {
        cat.petAcc = 0;
        const s = cat.scale * U;
        spawn('heart', cat.x + rand(-20, 20) * s, cat.y - 80 * s);
        addHearts(1); blip(rand(800, 1100));
      }
    }
    setPurr(cat.petHold > 0 || beingPet || (cat.state === 'sleep' && cat.happyT > 0));

    const toyActive = mode === 'play' && toy.inside && time - toy.lastMove < 4;
    const s = cat.scale * U;

    if (treats.length && cat.state !== 'eat') { wake(); cat.state = 'treat'; }
    else if (toyActive && cat.state !== 'eat' && cat.state !== 'treat') { wake(); cat.state = 'chase'; cat.idle = 0; }
    else if (cat.state === 'chase' && !toyActive) { cat.state = 'wander'; cat.sitT = rand(1, 3); }

    cat.pose = 'stand';
    cat.moving = false;
    switch (cat.state) {
      case 'wander': {
        if (cat.petHold > 0) { cat.pose = 'sit'; break; }
        if (cat.tx && (Math.abs(cat.tx - cat.x) > 4 || Math.abs(cat.ty - cat.y) > 4) && cat.sitT <= 0) {
          if (moveToward(cat.tx, cat.ty, 65, dt)) cat.sitT = rand(3, 7);
        } else {
          cat.pose = 'sit';
          cat.sitT -= dt;
          if (cat.sitT <= 0) {
            // pick somewhere nice: the sunbeam, the rug, or anywhere
            const r = Math.random();
            if (r < 0.25) { cat.tx = sun.x + rand(-40, 40) * U; cat.ty = sun.y + rand(-15, 15) * U; }
            else if (r < 0.5) { cat.tx = rug.x + rand(-80, 80) * U; cat.ty = rug.y + rand(-20, 20) * U; }
            else { cat.tx = rand(minX(), maxX()); cat.ty = rand(minY(), maxY()); }
            cat.tx = clamp(cat.tx, minX(), maxX()); cat.ty = clamp(cat.ty, minY(), maxY());
            if (Math.random() < 0.15) meow();
          }
        }
        if (cat.idle > 30) cat.state = 'toBed';
        break;
      }
      case 'chase': {
        const tx = clamp(toy.x, minX(), maxX());
        const ty = clamp(toy.y + 60 * s, minY(), maxY());
        const d = Math.hypot(tx - cat.x, ty - cat.y);
        if (cat.pounceT > 0) {
          cat.pounceT -= dt;
          cat.hop = Math.sin((1 - cat.pounceT / 0.55) * Math.PI) * 38;
          cat.x += cat.dir * 70 * U * dt;
          if (cat.pounceT <= 0) {
            cat.hop = 0;
            if (Math.hypot(toy.x - (cat.x + cat.dir * 40 * s), toy.y - (cat.y - 60 * s)) < 90 * s) {
              spawn('heart', toy.x, toy.y);
              spawn('text', toy.x, toy.y - 20, { text: 'got it!' });
              addHearts(1); blip(1000);
            }
          }
        } else if (d > 70 * s) {
          moveToward(tx, ty, 150, dt);
        } else {
          if (Math.abs(toy.x - cat.x) > 5) cat.dir = Math.sign(toy.x - cat.x);
          cat.pose = time - toy.lastMove > 0.6 ? 'sit' : 'stand';
          if (cat.pounceCd <= 0 && Math.abs(toy.vx) > 2) { cat.pounceT = 0.55; cat.pounceCd = 1.3; }
        }
        break;
      }
      case 'treat': {
        let best = treats[0];
        for (const t of treats) if (Math.hypot(t.x - cat.x, t.y - cat.y) < Math.hypot(best.x - cat.x, best.y - cat.y)) best = t;
        const side = best.x >= cat.x ? -1 : 1;
        const tx = best.x + side * 46 * s;
        if (moveToward(tx, best.y, 120, dt)) {
          cat.dir = -side;
          cat.state = 'eat'; cat.eatT = 2.2; cat.eating = best;
        }
        break;
      }
      case 'eat': {
        cat.eatT -= dt;
        cat.eating.bite = 1 - cat.eatT / 2.2;
        if (Math.floor(cat.eatT * 3) !== Math.floor((cat.eatT + dt) * 3)) spawn('text', cat.x + cat.dir * 50 * s, cat.y - 60 * s, { text: 'nom', max: 0.8, size: 10 });
        if (cat.eatT <= 0) {
          treats.splice(treats.indexOf(cat.eating), 1);
          cat.eating = null;
          for (let i = 0; i < 3; i++) spawn('heart', cat.x + rand(-20, 20) * s, cat.y - 80 * s, { vy: rand(-70, -40) });
          addHearts(3);
          cat.state = 'wander'; cat.sitT = rand(2, 4); cat.happyT = 1.5; cat.idle = 0; cat.tx = 0;
          if (Math.random() < 0.6) meow();
        }
        break;
      }
      case 'toBed': {
        if (moveToward(bed.x, bed.y - 4 * U, 45, dt)) { cat.state = 'sleep'; cat.dir = -1; }
        break;
      }
      case 'sleep': {
        cat.pose = 'sleep';
        cat.zT -= dt;
        if (cat.zT < 0) { cat.zT = 1.4; spawn('z', cat.x + 10 * s, cat.y - 50 * s, { vx: 12, vy: -22, max: 2.4 }); }
        break;
      }
    }
    if (cat.state !== 'chase') { cat.hop = 0; cat.pounceT = 0; }
    cat.x = clamp(cat.x, minX(), maxX());
    if (cat.state !== 'sleep' && cat.state !== 'toBed') cat.y = clamp(cat.y, minY(), maxY());
    cat.scale = 0.75 + 0.5 * clamp((cat.y - floorTop) / (H - floorTop), 0, 1);

    for (const t of treats) t.drop = Math.max(0, t.drop - dt * 3);
    for (const c of clouds) { c.x += dt * 0.006 * c.s; if (c.x > 1.3) c.x = -0.3; }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'z') p.x += Math.sin(p.life * 3) * 0.4;
      if (p.life > p.max) parts.splice(i, 1);
    }

    const status = {
      wander: cat.petHold > 0 ? 'Mochi is purring 💕' : (cat.moving ? 'Mochi is strolling' : 'Mochi is loafing about'),
      chase: 'Mochi is hunting the feather!',
      treat: 'Mochi smells something tasty…',
      eat: 'Mochi is munching 🐟',
      toBed: 'Mochi is getting sleepy…',
      sleep: cat.happyT > 0 ? 'Mochi is purring in their sleep' : 'Mochi is napping 💤',
    }[cat.state];
    if (status !== lastStatus) { $('status').textContent = status; lastStatus = status; }
  }
  let lastStatus = '';

  // ---------- drawing helpers ----------
  function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, Math.PI * 2); }
  function fs(fill) { ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function heartShape(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.9);
    ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.5);
    ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  }
  function thickLine(path, outer, inner, color, line) {
    path(); ctx.lineWidth = outer; ctx.strokeStyle = line; ctx.stroke();
    path(); ctx.lineWidth = inner; ctx.strokeStyle = color; ctx.stroke();
  }

  // ---------- room ----------
  function drawRoom() {
    // wall
    ctx.fillStyle = '#fbe4d3'; ctx.fillRect(0, 0, W, floorTop);
    ctx.fillStyle = 'rgba(255,170,170,0.18)';
    for (let y = 18; y < floorTop - 10; y += 34) for (let x = (y / 34 % 2) * 22 + 10; x < W; x += 44) {
      heartShape(x, y, 4); ctx.fill();
    }
    // window
    const wx = W * 0.1, wy = H * 0.07, ww = Math.min(W * 0.3, 320 * U + 60), wh = floorTop * 0.6;
    const g = ctx.createLinearGradient(0, wy, 0, wy + wh);
    g.addColorStop(0, '#9fd3f5'); g.addColorStop(1, '#dff2fb');
    ctx.fillStyle = g; ctx.fillRect(wx, wy, ww, wh);
    ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
    ctx.fillStyle = '#fff3b0'; ell(wx + ww * 0.78, wy + wh * 0.28, 18 * U, 18 * U); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    for (const c of clouds) {
      const cx = wx + c.x * ww, cy = wy + c.y * wh * 0.8, r = 12 * U * c.s;
      ell(cx, cy, r * 1.6, r); ctx.fill(); ell(cx - r, cy + 3, r, r * 0.7); ctx.fill(); ell(cx + r * 1.1, cy + 3, r, r * 0.7); ctx.fill();
    }
    ctx.fillStyle = '#b8e0a0'; ell(wx + ww * 0.3, wy + wh + 20 * U, ww * 0.5, 40 * U); ctx.fill();
    ctx.fillStyle = '#a3d48c'; ell(wx + ww * 0.85, wy + wh + 25 * U, ww * 0.45, 45 * U); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#fffaf3'; ctx.lineWidth = 8 * U;
    ctx.strokeRect(wx, wy, ww, wh);
    ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2);
    ctx.lineWidth = 5 * U; ctx.stroke();
    ctx.fillStyle = '#fffaf3'; ctx.fillRect(wx - 12 * U, wy + wh, ww + 24 * U, 10 * U);
    // curtains
    ctx.fillStyle = '#ffc1d0';
    for (const side of [0, 1]) {
      ctx.beginPath();
      const cx = side ? wx + ww + 4 * U : wx - 4 * U, dirc = side ? 1 : -1;
      ctx.moveTo(cx, wy - 10 * U);
      ctx.lineTo(cx + dirc * 26 * U, wy - 10 * U);
      ctx.quadraticCurveTo(cx + dirc * 10 * U, wy + wh * 0.6, cx + dirc * 22 * U, wy + wh * 0.95);
      ctx.lineTo(cx, wy + wh * 0.95); ctx.closePath(); ctx.fill();
    }
    // picture frame with a fish
    const px = W * 0.62, py = H * 0.1, pw = 90 * U, ph = 70 * U;
    ctx.fillStyle = '#d9a77a'; rrect(px - 6 * U, py - 6 * U, pw + 12 * U, ph + 12 * U, 6 * U); ctx.fill();
    ctx.fillStyle = '#e9f6ff'; ctx.fillRect(px, py, pw, ph);
    drawFish(px + pw / 2, py + ph / 2, 1.4 * U, 0, '#7cc4e8');
    // shelf + plant
    const sx = W * 0.82, sy = H * 0.2;
    ctx.fillStyle = '#c99268'; ctx.fillRect(sx - 60 * U, sy, 120 * U, 8 * U);
    ctx.fillStyle = '#e88f6a'; rrect(sx - 18 * U, sy - 28 * U, 36 * U, 28 * U, 5 * U); ctx.fill();
    ctx.fillStyle = '#7cbf72';
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * 0.45 + Math.sin(time * 0.8 + i) * 0.04; ell(sx + Math.cos(a) * 18 * U, sy - 28 * U + Math.sin(a) * 18 * U, 7 * U, 15 * U, a + Math.PI / 2); ctx.fill(); }
    ctx.fillStyle = '#9ad1f0'; rrect(sx + 30 * U, sy - 22 * U, 16 * U, 22 * U, 3 * U); ctx.fill();

    // baseboard + floor
    ctx.fillStyle = '#fffaf3'; ctx.fillRect(0, floorTop - 10 * U, W, 12 * U);
    ctx.fillStyle = '#e2b48c'; ctx.fillRect(0, floorTop, W, H - floorTop);
    ctx.strokeStyle = 'rgba(160,100,60,0.18)'; ctx.lineWidth = 2;
    const rows = 7;
    for (let i = 1; i < rows; i++) {
      const t = i / rows, y = floorTop + (H - floorTop) * t * t * 0.6 + (H - floorTop) * t * 0.4;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    // sunbeam from the window
    ctx.fillStyle = 'rgba(255,248,200,0.35)';
    ctx.beginPath();
    ctx.moveTo(wx + ww * 0.1, floorTop); ctx.lineTo(wx + ww * 0.9, floorTop);
    ctx.lineTo(sun.x + 150 * U, sun.y + 60 * U); ctx.lineTo(sun.x - 110 * U, sun.y + 60 * U);
    ctx.closePath(); ctx.fill();
    // rug
    ctx.fillStyle = '#c9e4de'; ell(rug.x, rug.y, 210 * U, 60 * U); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4 * U; ctx.setLineDash([10 * U, 8 * U]);
    ell(rug.x, rug.y, 185 * U, 48 * U); ctx.stroke(); ctx.setLineDash([]);
    // bed
    const bs = 0.75 + 0.5 * clamp((bed.y - floorTop) / (H - floorTop), 0, 1);
    ctx.fillStyle = 'rgba(80,50,40,0.12)'; ell(bed.x, bed.y + 6 * U, 80 * U * bs, 20 * U * bs); ctx.fill();
    ctx.fillStyle = '#b48cd8'; ell(bed.x, bed.y - 6 * U * bs, 76 * U * bs, 30 * U * bs); ctx.fill();
    ctx.fillStyle = '#e8d6ff'; ell(bed.x, bed.y - 10 * U * bs, 58 * U * bs, 18 * U * bs); ctx.fill();
  }

  function drawFish(x, y, sc, bite, color = '#ff9f7a') {
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.globalAlpha = 1 - bite * 0.9;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(20, -8); ctx.lineTo(20, 8); ctx.closePath(); ctx.fill();
    ell(-2, 0, 15 * (1 - bite * 0.5), 9 * (1 - bite * 0.3)); ctx.fill();
    ctx.fillStyle = '#3a2a28'; ell(-10, -2, 1.8, 1.8); ctx.fill();
    ctx.restore();
  }

  // ---------- cat ----------
  function drawHead(hx, hy, coat, expr, mouthOpen) {
    const acc = ACCESSORIES[save.acc].id;
    ctx.lineWidth = 3; ctx.strokeStyle = coat.line;
    if (acc === 'bell') {
      ctx.fillStyle = '#ff6b8a'; ell(hx - 2, hy + 17, 17, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd34d'; ell(hx + 6, hy + 24, 5, 5); ctx.fill(); ctx.stroke();
    }
    // ears
    ctx.beginPath(); ctx.moveTo(hx - 19, hy - 6); ctx.lineTo(hx - 13, hy - 33); ctx.lineTo(hx - 1, hy - 18); ctx.closePath(); fs(coat.fur);
    ctx.beginPath(); ctx.moveTo(hx + 3, hy - 18); ctx.lineTo(hx + 15, hy - 32); ctx.lineTo(hx + 21, hy - 5); ctx.closePath(); fs(coat.fur);
    ctx.fillStyle = '#ffb3c4';
    ctx.beginPath(); ctx.moveTo(hx - 15, hy - 11); ctx.lineTo(hx - 12, hy - 26); ctx.lineTo(hx - 5, hy - 17); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx + 7, hy - 17); ctx.lineTo(hx + 14, hy - 26); ctx.lineTo(hx + 17, hy - 10); ctx.closePath(); ctx.fill();
    // head
    ell(hx, hy, 25, 21); fs(coat.fur);
    ctx.save(); ell(hx, hy, 23.5, 19.5); ctx.clip();
    if (coat.stripe) {
      ctx.strokeStyle = coat.stripe; ctx.lineWidth = 3;
      for (const ox of [-6, 1, 8]) { ctx.beginPath(); ctx.moveTo(hx + ox, hy - 22); ctx.lineTo(hx + ox - 1, hy - 12); ctx.stroke(); }
    }
    if (coat.patches) { ctx.fillStyle = coat.patches[0]; ell(hx - 14, hy - 12, 14, 12); ctx.fill(); ctx.fillStyle = coat.patches[1]; ell(hx + 18, hy - 16, 10, 9); ctx.fill(); }
    ctx.fillStyle = coat.belly; ell(hx + 8, hy + 10, 13, 8); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = coat.line;
    // cheeks
    ctx.fillStyle = 'rgba(255,120,150,0.45)';
    ell(hx - 9, hy + 7, 5, 3); ctx.fill(); ell(hx + 21, hy + 6, 4, 3); ctx.fill();
    // eyes
    const eyeCol = '#2b1d1a';
    for (const ex of [hx - 3, hx + 13]) {
      const ey = hy - 1;
      ctx.lineWidth = 2.5; ctx.strokeStyle = coat.eye ? '#f4d35e' : eyeCol;
      if (expr === 'happy') {
        ctx.beginPath(); ctx.moveTo(ex - 4, ey + 1.5); ctx.quadraticCurveTo(ex, ey - 5, ex + 4, ey + 1.5); ctx.stroke();
      } else if (expr === 'sleep' || cat.blink > 0) {
        ctx.beginPath(); ctx.moveTo(ex - 4, ey); ctx.quadraticCurveTo(ex, ey + 4, ex + 4, ey); ctx.stroke();
      } else {
        const big = expr === 'big' ? 1.25 : 1;
        if (coat.eye) { ctx.fillStyle = coat.eye; ell(ex, ey, 4.6 * big, 5.6 * big); ctx.fill(); ctx.fillStyle = eyeCol; ell(ex + 0.5, ey, 2 * big, 4.6 * big); ctx.fill(); }
        else { ctx.fillStyle = eyeCol; ell(ex, ey, 3.8 * big, 5 * big); ctx.fill(); }
        ctx.fillStyle = '#fff'; ell(ex + 1.3, ey - 2, 1.5 * big, 1.5 * big); ctx.fill();
      }
    }
    // nose + mouth
    ctx.fillStyle = '#ff8fa3';
    ctx.beginPath(); ctx.moveTo(hx + 6, hy + 4); ctx.lineTo(hx + 12, hy + 4); ctx.lineTo(hx + 9, hy + 7.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = coat.eye ? '#8a7d95' : coat.line; ctx.lineWidth = 1.6;
    if (mouthOpen) {
      ctx.fillStyle = '#c4576c'; ell(hx + 9, hy + 11, 3.5, 2.5 + mouthOpen * 1.5); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(hx + 4, hy + 9); ctx.quadraticCurveTo(hx + 6.5, hy + 12, hx + 9, hy + 8.5);
      ctx.quadraticCurveTo(hx + 11.5, hy + 12, hx + 14, hy + 9); ctx.stroke();
    }
    // whiskers
    ctx.lineWidth = 1.2; ctx.strokeStyle = coat.eye ? 'rgba(255,255,255,0.6)' : 'rgba(90,61,54,0.55)';
    ctx.beginPath();
    ctx.moveTo(hx + 22, hy + 5); ctx.lineTo(hx + 36, hy + 2);
    ctx.moveTo(hx + 22, hy + 8); ctx.lineTo(hx + 36, hy + 10);
    ctx.moveTo(hx - 16, hy + 5); ctx.lineTo(hx - 29, hy + 3);
    ctx.moveTo(hx - 16, hy + 8); ctx.lineTo(hx - 29, hy + 10);
    ctx.stroke();
    // hats & bows
    ctx.lineWidth = 2; ctx.strokeStyle = coat.line;
    if (acc === 'bow') {
      ctx.fillStyle = '#ff6b9a';
      ctx.beginPath(); ctx.moveTo(hx - 8, hy - 20); ctx.lineTo(hx - 20, hy - 28); ctx.lineTo(hx - 19, hy - 13); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx - 8, hy - 20); ctx.lineTo(hx + 3, hy - 30); ctx.lineTo(hx + 5, hy - 15); ctx.closePath(); ctx.fill(); ctx.stroke();
      ell(hx - 8, hy - 20, 4, 4); ctx.fill(); ctx.stroke();
    } else if (acc === 'flowers') {
      const cols = ['#ff9fb8', '#fff07a', '#b9a3ff', '#ff9fb8', '#9fe0c2', '#fff07a'];
      for (let i = 0; i < 6; i++) {
        const a = Math.PI * (1.12 + i * 0.152);
        const fx = hx + Math.cos(a) * 23, fy = hy + Math.sin(a) * 19;
        ctx.fillStyle = cols[i]; ell(fx, fy, 5, 5); ctx.fill();
        ctx.fillStyle = '#fff'; ell(fx, fy, 1.8, 1.8); ctx.fill();
      }
    } else if (acc === 'party') {
      ctx.save(); ctx.translate(hx + 4, hy - 18); ctx.rotate(0.2);
      ctx.fillStyle = '#7ec8ff';
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(0, -28); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe066'; ell(-2, -8, 2.5, 2.5); ctx.fill(); ell(3, -15, 2, 2); ctx.fill(); ell(-1, -4, 1.5, 1.5); ctx.fill();
      ctx.fillStyle = '#ff7aa2'; ell(0, -29, 4.5, 4.5); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if (acc === 'crown') {
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath(); ctx.moveTo(hx - 10, hy - 17); ctx.lineTo(hx - 12, hy - 33); ctx.lineTo(hx - 4, hy - 25); ctx.lineTo(hx + 3, hy - 36);
      ctx.lineTo(hx + 9, hy - 25); ctx.lineTo(hx + 17, hy - 32); ctx.lineTo(hx + 14, hy - 17); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff6b8a'; ell(hx + 3, hy - 22, 2.5, 2.5); ctx.fill();
    }
  }

  function bodyDecor(coat, x, y, rx, ry) {
    ctx.save(); ell(x, y, rx - 1.5, ry - 1.5); ctx.clip();
    if (coat.stripe) {
      ctx.strokeStyle = coat.stripe; ctx.lineWidth = 4;
      for (const i of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(x + i * rx * 0.4 - 3, y - ry); ctx.quadraticCurveTo(x + i * rx * 0.4 + 4, y - ry * 0.5, x + i * rx * 0.4, y - ry * 0.2); ctx.stroke(); }
    }
    if (coat.patches) {
      ctx.fillStyle = coat.patches[0]; ell(x - rx * 0.4, y - ry * 0.5, rx * 0.45, ry * 0.6); ctx.fill();
      ctx.fillStyle = coat.patches[1]; ell(x + rx * 0.35, y - ry * 0.7, rx * 0.3, ry * 0.45); ctx.fill();
    }
    ctx.fillStyle = coat.belly; ell(x + rx * 0.15, y + ry * 0.75, rx * 0.6, ry * 0.45); ctx.fill();
    ctx.restore();
  }

  function drawCat() {
    const coat = COATS[save.coat];
    const s = cat.scale * U;
    ctx.save();
    ctx.translate(cat.x, cat.y);
    ctx.fillStyle = 'rgba(80,50,40,0.15)';
    ell(0, 0, 46 * s * (1 - cat.hop / 120), 9 * s); ctx.fill();
    ctx.translate(0, -cat.hop * s);
    ctx.scale(cat.dir * s, s);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.lineWidth = 3; ctx.strokeStyle = coat.line;

    const expr = cat.pose === 'sleep' ? 'sleep' : (cat.happyT > 0 || cat.petHold > 0 ? 'happy' : (cat.state === 'chase' ? 'big' : 'open'));
    const wag = Math.sin(time * (cat.state === 'chase' ? 7 : 2.5));

    if (cat.pose === 'sleep') {
      const br = 1 + Math.sin(time * 2) * 0.03;
      ctx.scale(1, br);
      ell(0, -20, 40, 20); fs(coat.fur);
      bodyDecor(coat, 0, -20, 40, 20);
      thickLine(() => { ctx.beginPath(); ctx.moveTo(-36, -10); ctx.bezierCurveTo(-44, 8, 20, 10, 40 + wag * 2, -2); }, 11, 6, coat.fur, coat.line);
      ctx.save(); ctx.translate(26, -20); ctx.rotate(0.15); ctx.scale(0.85, 0.85);
      drawHead(0, 0, coat, 'sleep', 0);
      ctx.restore();
    } else if (cat.pose === 'sit') {
      thickLine(() => { ctx.beginPath(); ctx.moveTo(-28, -10); ctx.bezierCurveTo(-46, -2, -30, 6, 6 + wag * 4, 0 - Math.abs(wag) * 3); }, 11, 6, coat.fur, coat.line);
      ell(-8, -22, 26, 21); fs(coat.fur);
      bodyDecor(coat, -8, -22, 26, 21);
      ell(8, -40, 18, 25); fs(coat.fur);
      ctx.save(); ell(8, -40, 16.5, 23.5); ctx.clip(); ctx.fillStyle = coat.belly; ell(15, -36, 9, 18); ctx.fill(); ctx.restore();
      rrect(4, -26, 9, 26, 4.5); fs(coat.fur);
      rrect(15, -26, 9, 26, 4.5); fs(coat.fur);
      drawHead(13, -70, coat, expr, 0);
    } else {
      const walk = cat.walkPhase, moving = cat.moving || cat.pounceT > 0;
      thickLine(() => {
        ctx.beginPath(); ctx.moveTo(-34, -36);
        ctx.bezierCurveTo(-56, -42, -58 + wag * 8, -70, -46 + wag * 8, -86);
      }, 11, 6, coat.fur, coat.line);
      const legs = [[-25, 0], [-13, Math.PI], [17, Math.PI], [29, 0]];
      for (const [lx, ph] of legs) {
        const sw = moving ? Math.sin(walk + ph) * 0.45 : (cat.pounceT > 0 ? 0.6 : 0);
        ctx.save(); ctx.translate(lx, -26); ctx.rotate(sw);
        rrect(-5, 0, 10, 26, 5); fs(coat.fur);
        ctx.restore();
      }
      const bob = moving ? Math.abs(Math.sin(walk)) * 2 : 0;
      ell(0, -34 - bob, 40, 21); fs(coat.fur);
      bodyDecor(coat, 0, -34 - bob, 40, 21);
      const eating = cat.state === 'eat';
      const headY = eating ? -36 + Math.abs(Math.sin(time * 9)) * 3 : -58 - bob;
      drawHead(38, headY, coat, eating ? 'happy' : expr, eating ? Math.abs(Math.sin(time * 9)) : 0);
    }
    ctx.restore();
  }

  function drawToy() {
    if (mode !== 'play' || !toy.inside) return;
    const sway = Math.sin(time * 4) * 0.25 + clamp(toy.vx * 0.03, -0.6, 0.6);
    ctx.save();
    ctx.strokeStyle = '#8a6a58'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(toy.x + 80 * U, -10);
    ctx.quadraticCurveTo(toy.x + 30 * U, toy.y * 0.5, toy.x, toy.y); ctx.stroke();
    ctx.translate(toy.x, toy.y); ctx.rotate(sway);
    const cols = ['#ff8fab', '#ffd166', '#7ec8ff'];
    cols.forEach((c, i) => { ctx.fillStyle = c; ell((i - 1) * 6 * U, 20 * U, 6 * U, 20 * U, (i - 1) * 0.35); ctx.fill(); });
    ctx.fillStyle = '#ffd34d'; ell(0, 0, 5 * U, 5 * U); ctx.fill();
    ctx.restore();
  }

  function drawParts() {
    for (const p of parts) {
      const a = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, Math.min(1, a * 1.5));
      if (p.kind === 'heart') {
        ctx.fillStyle = '#ff6f91';
        heartShape(p.x, p.y, p.size * U * (0.8 + p.life * 0.3)); ctx.fill();
      } else if (p.kind === 'z') {
        ctx.fillStyle = '#8a7db8'; ctx.font = `bold ${Math.round((14 + p.life * 6) * U)}px Trebuchet MS, sans-serif`;
        ctx.fillText('z', p.x, p.y);
      } else if (p.kind === 'text') {
        ctx.fillStyle = '#5a3d36'; ctx.font = `bold ${Math.round((p.size + 4) * U)}px Trebuchet MS, sans-serif`;
        ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); ctx.textAlign = 'left';
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawRoom();
    for (const t of treats) drawFish(t.x, t.y - t.drop * 80 * U, 1.1 * U, t.bite);
    drawCat();
    drawToy();
    drawParts();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  if (save.acc >= unlockedCount()) save.acc = 0;
  renderHearts(); renderSound();
  setTimeout(() => toast('Say hi to Mochi! ✋ pet · 🪶 play · 🐟 treats'), 400);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
